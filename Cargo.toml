[workspace]
resolver = "2"
members = ["karbon-framework", "karbon-macros", "karbon-cli", "examples/minimal"]

[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["LaRevueGeek"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/larevuegeek/karbon"

[workspace.dependencies]
# Web
axum = { version = "0.8", features = ["multipart", "macros", "ws"] }
axum-extra = { version = "0.12.5", features = ["typed-header"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "limit", "compression-full", "request-id", "util", "propagate-header", "set-header"] }
hyper = { version = "1.9.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "chrono", "uuid", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
argon2 = "0.5"
bcrypt = "0.19.0"
sha2 = "0.11.0"
uuid = { version = "1.23.0", features = ["v4", "serde"] }

# Docs / markdown
pulldown-cmark = "0.12"

# Utils
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
validator = { version = "0.20.0", features = ["derive"] }
slug = "0.1"
regex = "1"
rand = "0.10.0"
base64 = "0.22"

# Image processing
image = "0.25"

# HTTP client (for testing)
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
futures = "0.3"

# Email
lettre = { version = "0.11.20", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder", "hostname", "pool"] }
anyhow = "1"
