[package]
name = "karbon-framework"
description = "Karbon — Rust full-stack web framework with batteries included"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
license-file = "LICENSE"

[features]
default = ["mysql"]
mysql = ["sqlx/mysql"]
postgres = ["sqlx/postgres"]
sqlite = ["sqlx/sqlite"]
studio = ["dep:pulldown-cmark"]
templates = ["tera"]
minijinja = ["dep:minijinja"]
native-templates = []
scraping = ["dep:scraper"]
redis = ["dep:redis"]
cgi = []

[dependencies]
axum.workspace = true
axum-extra.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
hyper.workspace = true
hyper-util.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
jsonwebtoken.workspace = true
argon2.workspace = true
bcrypt.workspace = true
sha2.workspace = true
uuid.workspace = true
chrono.workspace = true
dotenvy.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
validator.workspace = true
slug.workspace = true
regex.workspace = true
rand.workspace = true
base64.workspace = true
image.workspace = true
ammonia = "4"
lettre.workspace = true
anyhow.workspace = true
reqwest.workspace = true
futures.workspace = true
tera = { version = "1", optional = true }
minijinja = { version = "2", optional = true, features = ["loader"] }
scraper = { version = "0.27.0", optional = true }
redis = { version = "0.27", optional = true, default-features = false, features = [
    "tokio-comp",
    "connection-manager",
] }
karbon-macros = { version = "0.3.1", path = "../karbon-macros" }
pulldown-cmark = { workspace = true, optional = true }

[package.metadata.docs.rs]
# Build docs with one DB driver (mysql) plus the optional modules so every
# public item is documented on docs.rs.
features = ["mysql", "studio", "templates", "minijinja", "native-templates", "scraping", "redis"]
rustdoc-args = ["--cfg", "docsrs"]
