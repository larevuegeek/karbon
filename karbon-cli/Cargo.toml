[package]
name = "karbon-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
license.workspace = true
description = "Karbon — unified CLI for Rust + SvelteKit full-stack projects"

[[bin]]
name = "karbon"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
toml = "1.2.1"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
colored = "3"
# `karbon new` and `karbon secret` generate the JWT secret.
rand = { workspace = true }
ctrlc = "3"
pulldown-cmark = { workspace = true }
reqwest = { version = "0.13.5", features = ["blocking"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "any",
    "mysql",
    "postgres",
    "sqlite",
] }

[target.'cfg(unix)'.dependencies]
# geteuid: `karbon maintenance` refuses, under root, flag paths the app user controls.
libc = "0.2"
