name: Release binaries

# Builds the `karbon` CLI for the common platforms and attaches the archives to a GitHub
# release, so installing Karbon does not mean compiling the CLI (`install.sh`,
# `install.ps1`). Two ways to start it:
#   - push a tag:            git tag v0.5.1 && git push origin v0.5.1
#   - or "Run workflow" on main: the tag v<workspace version> is created at that commit.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Create the release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag
        id: tag
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
            [ -n "$version" ] || { echo "no workspace version in Cargo.toml" >&2; exit 1; }
            tag="v${version}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # Created once here, so the build jobs only have to upload.
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --target "${GITHUB_SHA}" --title "$tag" --generate-notes

  build:
    name: karbon ${{ matrix.target }}
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04: the oldest image, so the binary runs on glibc 2.35 and later.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    env:
      # aws-lc (TLS, through reqwest) otherwise needs NASM on Windows.
      AWS_LC_SYS_PREBUILT_NASM: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build the CLI
        run: cargo build --release -p karbon-cli --target ${{ matrix.target }}

      # One archive per target, named without the version: the installers fetch
      # `releases/latest/download/karbon-<target>.<ext>`.
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="karbon-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/karbon" LICENSE-MIT LICENSE-APACHE "$name/"
          tar -czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "karbon-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/karbon.exe", LICENSE-MIT, LICENSE-APACHE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release.outputs.tag }}" karbon-${{ matrix.target }}.* --clobber
